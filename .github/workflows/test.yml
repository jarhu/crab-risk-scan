name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[docx,server,dev]'
      - run: python -m unittest discover -s tests -v

  engines:
    name: Live engines (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check out the pinned Mojo grammar for Pinch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HerringtonDarkholme/tree-sitter-mojo
          ref: 99fe918e69f087f910ef3b11eba31eb0d7e54edf
          path: .ci/mojo
          persist-credentials: false
      - name: Install CRAB and the trusted parser dependencies
        run: |
          python -m pip install '.[pinch,docx,server,dev]'
          cc -O2 -fPIC -I.ci/mojo/src -c .ci/mojo/src/parser.c -o "$RUNNER_TEMP/parser.o"
          c++ -O2 -fPIC -I.ci/mojo/src -c .ci/mojo/src/scanner.cc -o "$RUNNER_TEMP/scanner.o"
          c++ -shared "$RUNNER_TEMP/parser.o" "$RUNNER_TEMP/scanner.o" -o "$RUNNER_TEMP/mojo.so"
          rm -rf .ci
          echo "CRAB_MOJO_GRAMMAR=$RUNNER_TEMP/mojo.so" >> "$GITHUB_ENV"
      - name: Install the pinned engines with checksum verification
        run: |
          crab-risk-scan engines install --dest "$RUNNER_TEMP/engines"
          echo "CRAB_ENGINE_DIR=$RUNNER_TEMP/engines/bin" >> "$GITHUB_ENV"
          echo "CRAB_TEST_SYFT=$RUNNER_TEMP/engines/bin/syft" >> "$GITHUB_ENV"
      - name: Prepare the offline vulnerability databases
        run: |
          crab-risk-scan db update --cache-dir "$RUNNER_TEMP/crab-cache"
          echo "CRAB_CACHE_DIR=$RUNNER_TEMP/crab-cache" >> "$GITHUB_ENV"
      - run: crab-risk-scan engines
      - run: python -m unittest discover -s tests -v
      - name: Generate the example inventory with the installed CLI
        run: crab-risk-scan sbom examples/inventory --output "$RUNNER_TEMP/demo.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-cyclonedx-sbom
          path: ${{ runner.temp }}/demo.cdx.json
          if-no-files-found: error

  web:
    name: WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the WebUI into the package
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build the wheel and install it outside the checkout
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/venv"
          wheel="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "$wheel[server,docx]" jsonschema==4.26.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Validate installed CLI output against the SARIF 2.1.0 and report schemas
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json -o sarif-schema.json
          test -f "$(crab-risk-scan rules)"
          status=0
          crab-risk-scan scan "$GITHUB_WORKSPACE/examples/demo" --engines none --trivy "$GITHUB_WORKSPACE/examples/trivy-fs.json" \
            --output demo.sarif --output demo.json --output demo.docx --output demo.html || status=$?
          test "$status" = 1
          python - <<'PY'
          import json
          from importlib.resources import files
          from pathlib import Path
          import jsonschema
          sarif = json.loads(Path("demo.sarif").read_text())
          jsonschema.validate(sarif, json.loads(Path("sarif-schema.json").read_text()))
          assert len(sarif["runs"][0]["results"]) == 3
          schema = json.loads(files("crab_risk_scan").joinpath("schemas/report-v3.schema.json").read_text())
          jsonschema.Draft202012Validator(schema).validate(json.loads(Path("demo.json").read_text()))
          assert Path("demo.docx").stat().st_size > 0 and Path("demo.html").stat().st_size > 0
          PY
      - name: Serve the packaged WebUI and API from the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          CRAB_ADMIN_USERNAME: admin
          CRAB_ADMIN_PASSWORD: ci-only-password-1
        run: |
          crab-risk-scan serve --data-dir "$RUNNER_TEMP/server-data" --port 8080 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/health
          curl --silent --fail http://127.0.0.1:8080/ | grep -q '<div id="root">'
          kill %1
