[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crab-risk-scan"
dynamic = ["version"]
description = "Offline-first repository security scanner"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.optional-dependencies]
pinch = ["sqlfluff==3.4.2", "tree-sitter==0.25.2"]
docx = ["python-docx==1.2.0"]
server = ["fastapi==0.165.0", "uvicorn==0.54.0", "sqlalchemy==2.1.9", "jsonschema==4.26.0"]
postgres = ["psycopg[binary]==3.3.9"]
dev = ["httpx==0.28.1", "jsonschema==4.26.0", "build==1.6.1"]

[project.scripts]
crab-risk-scan = "crab_risk_scan.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "crab_risk_scan.__version__"}

[tool.setuptools.packages.find]
include = ["crab_risk_scan*"]

[tool.setuptools.package-data]
crab_risk_scan = ["opengrep-v1.yml", "engines.lock.json", "engines/*", "schemas/*.json", "server/static/**/*"]
